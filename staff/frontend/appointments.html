<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments - Hopewell Staff</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="staff.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">🏥 Hopewell Staff</div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="patients.html">🧑‍🦱 Patients</a></li>
        <li class="active"><a href="appointments.html">📅 Appointments</a></li>
        <li><a href="queue.html">⏳ Live Queue</a></li>
        <li><a href="doctors.html">🩺 Doctors</a></li>
        <li><a href="departments.html">🏢 Departments</a></li>
        <li><a href="reports.html">📈 Reports</a></li>
        <li style="margin-top: auto;"><a href="logout.html">🚪 Logout</a></li>
      </ul>
    </aside>

    <div class="main-wrapper">
      <header class="top-nav">
        <div style="display: flex; align-items: center;">
          <button class="mobile-menu-btn">☰</button>
          <div class="page-title">Appointment Management</div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="btn btn-primary" onclick="openModal('addAptModal')">+ New Appointment</button>
          <div class="user-profile">
            <div class="user-avatar">AD</div>
            <div><strong>Administrator</strong><br><small style="color:var(--text-muted)">General Admin</small></div>
          </div>
        </div>
      </header>

      <main class="content-body">
        <div class="card">
          <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
            <input id="appointmentSearch" class="form-control" placeholder="Search patient, doctor, or department..." style="max-width: 320px;">
            <select id="statusFilter" class="form-control" style="max-width: 200px;">
              <option value="">All Statuses</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Apt ID</th>
                  <th>Patient</th>
                  <th>Doctor</th>
                  <th>Department</th>
                  <th>Date & Time</th>
                  <th>Status</th>
                  <th>Change Status</th>
                </tr>
              </thead>
              <tbody id="aptTbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Appointment Modal -->
  <div class="modal-backdrop" id="addAptModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Book New Appointment</h3>
        <button class="modal-close" onclick="closeModal('addAptModal')">&times;</button>
      </div>
      <form id="newAptForm">
        <div class="form-group">
          <label>Patient</label>
          <select id="apt_patient" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label>Department</label>
          <select id="apt_dept" class="form-control">
          </select>
        </div>
        <div class="form-group">
          <label>Doctor</label>
          <select id="apt_doctor" class="form-control">
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="apt_date" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Time Slot</label>
          <input type="time" id="apt_time" class="form-control" value="10:00" required>
        </div>
        <button type="submit" class="btn btn-teal" style="width: 100%;">Create Appointment</button>
      </form>
    </div>
  </div>

  <script src="staff.js"></script>
  <script>
    let appointmentRows = [];
    function renderAppts() {
      const filter = document.getElementById('statusFilter').value;
      const query = document.getElementById('appointmentSearch').value.trim().toLowerCase();
      let data = appointmentRows;
      if (filter) data = data.filter(a => a.status === filter.toLowerCase());
      if (query) data = data.filter(a => [a.patient_name, a.doctor_name, a.department_name].some(value => String(value || '').toLowerCase().includes(query)));

      const tbody = document.getElementById('aptTbody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:20px;">No appointments matching criteria.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr>
          <td><strong>${escapeHtml(item.appointment_number)}</strong></td>
          <td>${escapeHtml(item.patient_name)}</td>
          <td>${escapeHtml(item.doctor_name)}</td>
          <td>${escapeHtml(item.department_name)}</td>
          <td>${escapeHtml(new Date(item.scheduled_at).toLocaleString())}</td>
          <td><span class="badge badge-${escapeHtml(item.status)}">${escapeHtml(item.status.replace('_', ' '))}</span></td>
          <td>
            <select onchange="changeStatus(${Number(item.appointment_id)}, this.value)" class="form-control" style="font-size:12px; padding:3px 6px; width:auto;">
              <option value="pending" ${item.status==='pending'?'selected':''}>Pending</option>
              <option value="confirmed" ${item.status==='confirmed'?'selected':''}>Confirmed</option>
              <option value="completed" ${item.status==='completed'?'selected':''}>Completed</option>
              <option value="cancelled" ${item.status==='cancelled'?'selected':''}>Cancelled</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    async function loadAppointments() {
      appointmentRows = (await apiRequest('/appointments')).items;
      renderAppts();
    }

    async function changeStatus(id, newStatus) {
      try {
        await apiRequest(`/appointments/${id}`, { method: 'PATCH', body: { status: newStatus } });
        await loadAppointments();
        showToast('Appointment status updated.');
      } catch (error) { showToast(error.message, 'error'); }
    }

    document.getElementById('statusFilter').addEventListener('change', renderAppts);
    document.getElementById('appointmentSearch').addEventListener('input', renderAppts);

    let allDoctors = [];
    document.getElementById('newAptForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = document.getElementById('apt_date').value;
      if (date < todayIso()) {
        showToast('Appointments cannot be scheduled in the past.', 'error');
        return;
      }
      try {
        const scheduledAt = new Date(`${date}T${document.getElementById('apt_time').value}`).toISOString();
        await apiRequest('/appointments', { method: 'POST', body: {
          patient_id: Number(document.getElementById('apt_patient').value),
          department_id: Number(document.getElementById('apt_dept').value),
          doctor_staff_id: Number(document.getElementById('apt_doctor').value) || null,
          scheduled_at: scheduledAt
        }});
        closeModal('addAptModal');
        await loadAppointments();
        showToast('Appointment scheduled successfully!');
        e.target.reset();
      } catch (error) { showToast(error.message, 'error'); }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      if (!(await checkPageAccess())) return;
      if (getCurrentUser()?.role !== 'admin' && getCurrentUser()?.role !== 'receptionist') {
        document.querySelector('.top-nav .btn-primary')?.setAttribute('hidden', 'hidden');
      }
      const [departmentResponse, patientResponse, doctorResponse] = await Promise.all([
        apiRequest('/departments'), apiRequest('/patients'), apiRequest('/doctors')
      ]);
      const departments = departmentResponse.items.filter(item => item.status === 'active');
      const departmentSelect = document.getElementById('apt_dept');
      departmentSelect.innerHTML = departments.map(item => `<option value="${Number(item.department_id)}">${escapeHtml(item.department_name)}</option>`).join('');
      document.getElementById('apt_patient').innerHTML = patientResponse.items.map(item => `<option value="${Number(item.patient_id)}">${escapeHtml(item.full_name)} (${escapeHtml(item.patient_number)})</option>`).join('');
      const doctorSelect = document.getElementById('apt_doctor');
      allDoctors = doctorResponse.items;
      const refreshDoctors = () => {
        const selectedDepartment = Number(departmentSelect.value);
        doctorSelect.innerHTML = '<option value="">Unassigned</option>' + allDoctors.filter(item => Number(item.department_id) === selectedDepartment && item.availability === 'on_duty')
          .map(item => `<option value="${Number(item.staff_id)}">${escapeHtml(item.full_name)}</option>`).join('');
      };
      departmentSelect.addEventListener('change', refreshDoctors);
      refreshDoctors();
      document.getElementById('apt_date').value = todayIso();
      try { await loadAppointments(); } catch (error) { showToast(error.message, 'error'); }
    });
  </script>
</body>
</html>
