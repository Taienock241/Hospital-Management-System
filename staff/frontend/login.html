<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - Hopewell</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="staff.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="color: var(--primary-blue);">🏥 Hopewell</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Staff & Administration Portal</p>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Email</label>
        <input type="email" id="username" class="form-control" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
        <div style="margin-top: 6px;">
          <input type="checkbox" id="showPass"> <label for="showPass" style="display:inline; font-size:12px; font-weight:normal;">Show Password</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In to Portal</button>
    </form>
  </div>

  <script src="staff.js"></script>
  <script>
    document.getElementById('showPass').addEventListener('change', function() {
      const pass = document.getElementById('password');
      pass.type = this.checked ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const button = this.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        await apiRequest('/auth/login', { method: 'POST', body: {
          email: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        }});
        window.location.href = 'dashboard.html';
      } catch (error) {
        showToast(error.message, 'error');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
